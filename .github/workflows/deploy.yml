name: Inbound-Frontend-Deployment-Pipeline

on:
  push:
    branches:
      - dev
      - feat/IND-7-live-inbox-reconnect

jobs:
  ci:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            cd /opt/inbound-frontend-b1

            git pull origin dev

            docker build -t inbound-frontend:latest .

            docker stop inbound-frontend || true
            docker rm inbound-frontend || true

            docker run -d \
              --name inbound-frontend \
              --restart unless-stopped \
              -p 8080:80 \
              inbound-frontend:latest

            sleep 10

            echo "Inbound Frontend Deployment successful"